name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "phase0/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-replay:
    name: database-replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Verify canonical migration history
        run: npm run migrations:verify

      - name: Replay migrations on PostgreSQL 17
        run: npm run migrations:replay
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Environment contract
        run: npm run env:check:ci
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          MARKETING_PROVIDER: noop
          DTE_PROVIDER: noop
          PAYMENTS_TUU_ENABLED: "false"
          TUU_REMOTE_POS_ENABLED: "false"

      - name: Supabase migration history
        run: npm run migrations:verify

      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        run: npm run prettier:check

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          MARKETING_PROVIDER: noop
          DTE_PROVIDER: noop
          PAYMENTS_TUU_ENABLED: "false"
          TUU_REMOTE_POS_ENABLED: "false"
